[tool.poetry]
name = "risklence-scanner"
version = "0.2.0"
description = "Risklence Scanner agent — installs on operator infrastructure, runs approved discovery/vulnerability tools (Nmap/Subfinder/Nuclei), and reports results back to the Risklence platform."
authors = ["Risklence Team"]
readme = "README.md"
# Apache-2.0 (Søren, 2026-10-07): free for anyone to use, and NOTICE keeps Risklence credited.
# The licence is fixed per PyPI release. It covers the Collector code only; the scan tools
# it runs keep their own licences (see NOTICE).
license = "Apache-2.0"
homepage = "https://github.com/Risklence/scanner"
repository = "https://github.com/Risklence/scanner"
documentation = "https://github.com/Risklence/scanner/blob/main/README.md"
keywords = ["risklence", "scanner", "collector", "nmap", "resilience", "discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
packages = [{ include = "scanner_agent" }]

[tool.poetry.urls]
"Security policy" = "https://github.com/Risklence/scanner/blob/main/SECURITY.md"

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.7"
requests = "^2.31.0"
urllib3 = "^2.8.0"
defusedxml = "^0.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
responses = "^0.24.1"

[tool.poetry.scripts]
risklence-scanner = "scanner_agent.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
